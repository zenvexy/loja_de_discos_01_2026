<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Discos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestão de Discos</h1>
        <span>Olá, <strong id="nome-usuario"></strong></span>
    </header>
    <nav>
        <a href="home.html">Home</a>
        <a href="cadastro_discos.html">Cadastro de Discos</a>
        <button class="btn-logout" id="btn-logout">Sair</button>
    </nav>
    <main>
        <div class="form-card">
            <h3 id="form-movimentacao-titulo" onclick="novaMovimentacao()">Nova Movimentação</h3>
            <input type="hidden" id="movimentacao-id">

            <div class="form-group">
                <label>Tipo</label>
                <select id="select-tipo">
                    <option value="FABRICADO">Fabricado (Entrada)</option>
                    <option value="PEDIDO">Pedido (Saída)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Quantidade</label>
                <input type="number" id="input-quantidade" min="1" value="1">
            </div>

            <div class="form-group">
                <label>Data da Movimentação</label>
                <input type="date" id="input-data">
            </div>

            <button class="btn-success" id="btn-registrar" onclick="registrarMovimentacao()">Registrar</button>
            <button class="btn-danger" id="btn-cancelar-edicao-movimentacao" onclick="cancelarEdicaoMovimentacao()">Cancelar Edição</button>
        </div>

        <h3 class="section-title">Movimentações</h3>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Produto</th>
                    <th>Tipo</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <th>Usuário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-movimentacoes"></tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>
</html>
