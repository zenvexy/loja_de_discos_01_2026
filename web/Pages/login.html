
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Loja de Discos</title>
    <link rel="stylesheet" href="../Style/login.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <h1>Loja de Discos</h1>
            <p class="subtitle"> Entre para gerenciar seu acervo musical. </p>
            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="username" required />
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                <p id="mensagem-login" role="alert"></p>
            </form>
        </section>
    </main>
    <script src="../Script/login.js"></script>
</body>
</html>
